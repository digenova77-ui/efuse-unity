services:
  dclm:
    build:
      context: ..
      dockerfile: vps/Dockerfile
    container_name: dclm
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - dclm-data:/dclm/data
      - dclm-receipts:/dclm/receipts
    environment:
      - DCLM_MODE=production
      - DCLM_NETWORK=testnet
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  dclm-data:
  dclm-receipts:
